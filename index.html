async function checkSession(){
const {data}=await supabaseClient.auth.getSession();
if(data.session){currentUser=data.session.user;await loadPlayerStats(currentUser);showGame()}else showAuth()
}
async function loadPlayerStats(user){
if(!user)return;
const {data,error}=await supabaseClient.from("leaderboard").select("username,best_percentage,dominant_color,total_play_seconds,cubes_completed,colors").eq("user_id",user.id).maybeSingle();
if(error){console.error("Stats load:",error);return}
if(data){
stats.bestPercentage=Number(data.best_percentage||0);
stats.dominantColor=data.dominant_color||"white";
stats.totalPlaySeconds=Number(data.total_play_seconds||0);
stats.cubesCompleted=Number(data.cubes_completed||0);
stats.colors=Array.isArray(data.colors)?data.colors:[];
}else{
stats={bestPercentage:0,dominantColor:"white",totalPlaySeconds:0,cubesCompleted:0,colors:[]};
}
updateStatsUI()
}
function updateStatsUI(){
const username=currentUser?.user_metadata?.username||currentUser?.email?.split("@")[0]||"Игрок";
playerStatsName.textContent=username;
bestPercentageStat.textContent=stats.bestPercentage+"%";
bestPercentageStat.style.color=stats.dominantColor;
playTimeStat.textContent=formatTime(stats.totalPlaySeconds);
cubesCompletedStat.textContent=stats.cubesCompleted;
}
function formatTime(seconds){
seconds=Math.floor(seconds);
const days=Math.floor(seconds/86400);
seconds%=86400;
const hours=Math.floor(seconds/3600);
seconds%=3600;
const minutes=Math.floor(seconds/60);
const secs=seconds%60;
if(days>0)return `${days}д ${hours}ч`;
if(hours>0)return `${hours}ч ${minutes}м`;
if(minutes>0)return `${minutes}м ${secs}с`;
return `${secs}с`;
}
function startPlayTimer(){
if(playTimer||!currentUser)return;
lastPlaySave=Date.now();
playTimer=setInterval(async()=>{
const now=Date.now();
const delta=Math.floor((now-lastPlaySave)/1000);
if(delta>0){
stats.totalPlaySeconds+=delta;
lastPlaySave=now;
updateStatsUI();
if(stats.totalPlaySeconds%10<delta)await savePlayerStats();
}
},1000)
}
function stopPlayTimer(){
if(playTimer){clearInterval(playTimer);playTimer=null}
}
async function savePlayerStats(){
if(!currentUser)return;
const username=currentUser.user_metadata?.username||currentUser.email?.split("@")[0]||"Игрок";
const payload={
user_id:currentUser.id,
username:username,
best_percentage:stats.bestPercentage,
dominant_color:stats.dominantColor,
total_play_seconds:stats.totalPlaySeconds,
cubes_completed:stats.cubesCompleted,
colors:stats.colors||[]
};
const {error}=await supabaseClient.from("leaderboard").upsert(payload,{onConflict:"user_id"});
if(error)console.error("Stats save:",error)
}
const MAX_CUBES=21;
const LINE_COUNT=80;
const FILL_TIME=3000;
const GAP=10;
const cubesContainer=document.getElementById("cubes");
const addButton=document.getElementById("addCube");
const removeButton=document.getElementById("removeCube");
const restartButton=document.getElementById("restart");
const percentageButton=document.getElementById("percentageButton");
const fastModeCheckbox=document.getElementById("fastModeCheckbox");
let cubes=[];
function randomColor(){
const hue=Math.floor(Math.random()*360);
const saturation=75+Math.random()*25;
const lightness=50+Math.random()*20;
return{css:`hsl(${hue},${saturation}%,${lightness}%)`,hue:hue}
}
function generateColors(){
const colors=[];
for(let i=0;i<LINE_COUNT;i++)colors.push(randomColor());
return colors
}
function createCube(){
const cube=document.createElement("div");
cube.className="cube";
const canvas=document.createElement("canvas");
cube.appendChild(canvas);
const percentage=document.createElement("div");
percentage.className="percentage";
percentage.textContent="0%";
cube.appendChild(percentage);
cubesContainer.appendChild(cube);
const data={element:cube,canvas:canvas,percentage:percentage,colors:generateColors(),progress:0,animation:null,showPercentage:false,counted:false};
cubes.push(data);
resizeCube(data);
return data
}
function resizeCube(data){
const rect=data.element.getBoundingClientRect();
if(rect.width<=0||rect.height<=0)return;
const size=Math.floor(Math.min(rect.width,rect.height));
data.canvas.width=size;
data.canvas.height=size;
drawCube(data,data.progress)
}
function drawCube(data,progress){
const canvas=data.canvas;
const ctx=canvas.getContext("2d");
const size=canvas.width;
if(size<=0)return;
ctx.clearRect(0,0,size,size);
const center=size/2;
const lineHeight=size/LINE_COUNT;
ctx.save();
ctx.beginPath();
ctx.moveTo(0,0);
ctx.lineTo(center,center);
ctx.lineTo(0,size);
ctx.closePath();
ctx.clip();
for(let i=0;i<LINE_COUNT;i++){
const y=i*lineHeight;
const maxX=center*(1-Math.abs(y+lineHeight/2-center)/center);
ctx.fillStyle=data.colors[i].css;
ctx.fillRect(0,y,maxX*progress,lineHeight+1)
}
ctx.restore();
ctx.save();
ctx.beginPath();
ctx.moveTo(size,0);
ctx.lineTo(center,center);
ctx.lineTo(size,size);
ctx.closePath();
ctx.clip();
for(let i=0;i<LINE_COUNT;i++){
const y=i*lineHeight;
const maxX=center*(1-Math.abs(y+lineHeight/2-center)/center);
const currentX=maxX*progress;
ctx.fillStyle=data.colors[(i+20)%LINE_COUNT].css;
ctx.fillRect(size-currentX,y,currentX,lineHeight+1)
}
ctx.restore();
ctx.save();
ctx.beginPath();
ctx.moveTo(0,0);
ctx.lineTo(size,0);
ctx.lineTo(center,center);
ctx.closePath();
ctx.clip();
const lineWidth=size/LINE_COUNT;
for(let i=0;i<LINE_COUNT;i++){
const x=i*lineWidth;
const maxY=center*(1-Math.abs(x+lineWidth/2-center)/center);
ctx.fillStyle=data.colors[(i+40)%LINE_COUNT].css;
ctx.fillRect(x,0,lineWidth+1,maxY*progress)
}
ctx.restore();
ctx.save();
ctx.beginPath();
ctx.moveTo(0,size);
ctx.lineTo(center,center);
ctx.lineTo(size,size);
ctx.closePath();
ctx.clip();
for(let i=0;i<LINE_COUNT;i++){
const x=i*lineWidth;
const maxY=center*(1-Math.abs(x+lineWidth/2-center)/center);
const currentY=maxY*progress;
ctx.fillStyle=data.colors[(i+60)%LINE_COUNT].css;
ctx.fillRect(x,size-currentY,lineWidth+1,currentY)
}
ctx.restore();
if(progress>=1){
ctx.fillStyle="#fff";
ctx.beginPath();
ctx.arc(center,center,2,0,Math.PI*2);
ctx.fill()
}
}
function animateCube(data){
data.counted=false;
if(fastModeCheckbox.checked){
if(data.animation)cancelAnimationFrame(data.animation);
data.progress=0;
drawCube(data,0);
requestAnimationFrame(()=>{
data.progress=1;
drawCube(data,1);
completeCube(data);
checkAllCubesFilled()
});
return
}
if(data.animation)cancelAnimationFrame(data.animation);
const start=performance.now();
function frame(now){
const elapsed=now-start;
data.progress=Math.min(elapsed/FILL_TIME,1);
drawCube(data,data.progress);
if(data.progress<1)data.animation=requestAnimationFrame(frame);
else{
data.animation=null;
completeCube(data);
checkAllCubesFilled()
}
}
data.progress=0;
data.animation=requestAnimationFrame(frame)
}
function completeCube(data){
if(data.counted)return;
if(data.progress<1)return;
data.counted=true;
stats.cubesCompleted++;
updateStatsUI();
savePlayerStats()
}
function checkAllCubesFilled(){
if(cubes.length===0){percentageButton.style.display="none";return}
const allFilled=cubes.every(cube=>cube.progress>=1);
percentageButton.style.display=allFilled?"block":"none"
}
function getDominantColor(data){
const groups=[];
data.colors.forEach(color=>{
let found=null;
for(const group of groups){
let difference=Math.abs(color.hue-group.hue);
difference=Math.min(difference,360-difference);
if(difference<=5){found=group;break}
}
if(found)found.count++;
else groups.push({hue:color.hue,count:1,css:color.css})
});
groups.sort((a,b)=>b.count-a.count);
return groups[0]
}
async function showPercentages(){
if(!cubes.every(cube=>cube.progress>=1))return;
let best=null;
cubes.forEach(cube=>{
const dominant=getDominantColor(cube);
const percentage=Math.round(dominant.count/LINE_COUNT*100);
cube.percentage.textContent=percentage+"%";
cube.percentage.style.color=dominant.css;
cube.percentage.style.display="block";
cube.showPercentage=true;
if(!best||percentage>best.percentage){
best={percentage:percentage,dominantCss:dominant.css,colors:cube.colors.map(color=>color.css)}
}
});
if(best&&best.percentage>stats.bestPercentage){
stats.bestPercentage=best.percentage;
stats.dominantColor=best.dominantCss;
stats.colors=best.colors;
updateStatsUI();
await savePlayerStats()
}else if(best&&stats.bestPercentage===best.percentage&&(!stats.colors||stats.colors.length!==LINE_COUNT)){
stats.dominantColor=best.dominantCss;
stats.colors=best.colors;
await savePlayerStats()
}
}
function updateLayout(){
const count=cubes.length;
if(!count)return;
const gameArea=document.getElementById("gameArea");
const areaWidth=gameArea.clientWidth;
const areaHeight=gameArea.clientHeight;
let bestColumns=1;
let bestRows=count;
let bestSize=0;
for(let columns=1;columns<=count;columns++){
const rows=Math.ceil(count/columns);
const width=(areaWidth-GAP*(columns-1))/columns;
const height=(areaHeight-GAP*(rows-1))/rows;
const size=Math.floor(Math.min(width,height));
if(size>bestSize){bestSize=size;bestColumns=columns;bestRows=rows}
}
cubesContainer.style.gridTemplateColumns=`repeat(${bestColumns},${bestSize}px)`;
cubesContainer.style.gridTemplateRows=`repeat(${bestRows},${bestSize}px)`;
cubes.forEach(resizeCube)
}

}

function renderLeaderboardSlot(slot,row,mode){
const canvas=slot.querySelector("canvas");
const percentageEl=slot.querySelector(".lbPercentage");
const valueEl=slot.querySelector(".lbValue");
const nameEl=slot.querySelector(".lbName");
const wrap=slot.querySelector(".lbCubeWrap");
const ctx=canvas.getContext("2d");
ctx.clearRect(0,0,canvas.width,canvas.height);
percentageEl.textContent="";
valueEl.textContent="";
nameEl.textContent=row?row.username:"—";
wrap.style.display="none";
if(!row)return;
if(mode==="percentage"){
wrap.style.display="block";
const size=Math.floor(wrap.getBoundingClientRect().width);
canvas.width=size>0?size:200;
canvas.height=canvas.width;
const colors=Array.isArray(row.colors)?row.colors:[];
if(colors.length===LINE_COUNT){
drawCube({canvas:canvas,colors:colors.map(css=>({css:css}))},1)
}else{
ctx.fillStyle="#000";
ctx.fillRect(0,0,canvas.width,canvas.height);
}
percentageEl.textContent=Number(row.best_percentage||0)+"%";
percentageEl.style.color=row.dominant_color||"white";
}else if(mode==="time"){
valueEl.textContent=formatTime(Number(row.total_play_seconds||0));

}
}
async function loadLeaderboard(mode){

if(mode==="cubes")query=query.order("cubes_completed",{ascending:false});

console.error("Leaderboard load:",error);
leaderboardMessage.textContent="Не удалось загрузить таблицу лидеров.";
return
}
leaderboardMessage.textContent=data.length?"":"Пока нет результатов.";

})
}
