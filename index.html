<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Кубы</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

#gameArea {

    top: 50%;

<body>


<div id="gameArea">

    <div id="cubes"></div>

</div>


<div id="controls">


    <!-- БЫСТРЫЙ РЕЖИМ -->

    <label id="fastMode">

        <input
            type="checkbox"
            id="fastModeCheckbox"
        >

        <span>Быстрый режим</span>

    </label>


    <!-- ДОБАВИТЬ КУБ -->

    <button id="addCube">
        Добавить куб 1/21
    </button>


    <!-- УБРАТЬ КУБ -->

    <button
        id="removeCube"
        style="display: none;"
    >
        Убрать куб
    </button>


    <!-- ЗАНОВО -->

    <button id="restart">
        Заново
    </button>


    <!-- ПРОЦЕНТЫ -->

    <button id="percentageButton">
        Посмотреть проценты до идеала
    </button>


</div>


<script>


/* =====================================================
   НАСТРОЙКИ
===================================================== */

const MAX_CUBES = 21;

const LINE_COUNT = 80;

const FILL_TIME = 3000;

const GAP = 10;


/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const cubesContainer =
    document.getElementById("cubes");

const addButton =
    document.getElementById("addCube");

const removeButton =
    document.getElementById("removeCube");

const restartButton =
    document.getElementById("restart");

const percentageButton =
    document.getElementById("percentageButton");

const fastModeCheckbox =
    document.getElementById("fastModeCheckbox");


/* =====================================================
   КУБЫ
===================================================== */

let cubes = [];


/* =====================================================
   СЛУЧАЙНЫЙ ЦВЕТ
===================================================== */

function randomColor() {

    const hue =
        Math.floor(
            Math.random() * 360
        );

    const saturation =
        75 +
        Math.random() * 25;

    const lightness =
        50 +
        Math.random() * 20;


    return {

        css:
            `hsl(${hue}, ${saturation}%, ${lightness}%)`,

        hue:
            hue

    };
}


/* =====================================================
   ЦВЕТА
===================================================== */

function generateColors() {

    const colors = [];


    for (
        let i = 0;
        i < LINE_COUNT;
        i++
    ) {

        colors.push(
            randomColor()
        );

    }


    return colors;
}


/* =====================================================
   СОЗДАНИЕ КУБА
===================================================== */

function createCube() {

    const cube =
        document.createElement("div");


    cube.className =
        "cube";


    const canvas =
        document.createElement("canvas");


    cube.appendChild(canvas);


    /*
       ПРОЦЕНТ
    */

    const percentage =
        document.createElement("div");


    percentage.className =
        "percentage";


    percentage.textContent =
        "0%";


    cube.appendChild(
        percentage
    );


    cubesContainer.appendChild(
        cube
    );


    const data = {

        element:
            cube,

        canvas:
            canvas,

        percentage:
            percentage,

        colors:
            generateColors(),

        progress:
            0,

        animation:
            null,

        showPercentage:
            false

    };


    cubes.push(data);


    resizeCube(data);


    return data;
}


/* =====================================================
   РАЗМЕР КУБА
===================================================== */

function resizeCube(data) {

    const rect =
        data.element.getBoundingClientRect();


    if (
        rect.width <= 0 ||
        rect.height <= 0
    ) {

        return;
    }


    const size =
        Math.floor(
            Math.min(
                rect.width,
                rect.height
            )
        );


    data.canvas.width =
        size;


    data.canvas.height =
        size;


    drawCube(
        data,
        data.progress
    );
}


/* =====================================================
   РИСОВАНИЕ
===================================================== */

function drawCube(
    data,
    progress
) {

    const canvas =
        data.canvas;


    const ctx =
        canvas.getContext("2d");


    const size =
        canvas.width;


    if (size <= 0) {

        return;
    }


    ctx.clearRect(
        0,
        0,
        size,
        size
    );


    const center =
        size / 2;


    /* =================================================
       ЛЕВО
    ================================================= */

    ctx.save();


    ctx.beginPath();


    ctx.moveTo(
        0,
        0
    );


    ctx.lineTo(
        center,
        center
    );


    ctx.lineTo(
        0,
        size
    );


    ctx.closePath();


    ctx.clip();


    const lineHeight =
        size / LINE_COUNT;


    for (
        let i = 0;
        i < LINE_COUNT;
        i++
    ) {

        const y =
            i * lineHeight;


        const maxX =
            center *
            (
                1 -
                Math.abs(
                    y +
                    lineHeight / 2 -
                    center
                ) /
                center
            );


        const currentX =
            maxX *
            progress;


        ctx.fillStyle =
            data.colors[i].css;


        ctx.fillRect(
            0,
            y,
            currentX,
            lineHeight + 1
        );

    }


    ctx.restore();


    /* =================================================
       ПРАВО
    ================================================= */

    ctx.save();


    ctx.beginPath();


    ctx.moveTo(
        size,
        0
    );


    ctx.lineTo(
        center,
        center
    );


    ctx.lineTo(
        size,
        size
    );


    ctx.closePath();


    ctx.clip();


    for (
        let i = 0;
        i < LINE_COUNT;
        i++
    ) {

        const y =
            i * lineHeight;


        const maxX =
            center *
            (
                1 -
                Math.abs(
                    y +
                    lineHeight / 2 -
                    center
                ) /
                center
            );


        const currentX =
            maxX *
            progress;


        ctx.fillStyle =
            data.colors[
                (i + 20) %
                LINE_COUNT
            ].css;


        ctx.fillRect(
            size - currentX,
            y,
            currentX,
            lineHeight + 1
        );

    }


    ctx.restore();


    /* =================================================
       ВЕРХ
    ================================================= */

    ctx.save();


    ctx.beginPath();


    ctx.moveTo(
        0,
        0
    );


    ctx.lineTo(
        size,
        0
    );


    ctx.lineTo(
        center,
        center
    );


    ctx.closePath();


    ctx.clip();


    const lineWidth =
        size / LINE_COUNT;


    for (
        let i = 0;
        i < LINE_COUNT;
        i++
    ) {

        const x =
            i * lineWidth;


        const maxY =
            center *
            (
                1 -
                Math.abs(
                    x +
                    lineWidth / 2 -
                    center
                ) /
                center
            );


        const currentY =
            maxY *
            progress;


        ctx.fillStyle =
            data.colors[
                (i + 40) %
                LINE_COUNT
            ].css;


        ctx.fillRect(
            x,
            0,
            lineWidth + 1,
            currentY
        );

    }


    ctx.restore();


    /* =================================================
       НИЗ
    ================================================= */

    ctx.save();


    ctx.beginPath();


    ctx.moveTo(
        0,
        size
    );


    ctx.lineTo(
        center,
        center
    );


    ctx.lineTo(
        size,
        size
    );


    ctx.closePath();


    ctx.clip();


    for (
        let i = 0;
        i < LINE_COUNT;
        i++
    ) {

        const x =
            i * lineWidth;


        const maxY =
            center *
            (
                1 -
                Math.abs(
                    x +
                    lineWidth / 2 -
                    center
                ) /
                center
            );


        const currentY =
            maxY *
            progress;


        ctx.fillStyle =
            data.colors[
                (i + 60) %
                LINE_COUNT
            ].css;


        ctx.fillRect(
            x,
            size - currentY,
            lineWidth + 1,
            currentY
        );

    }


    ctx.restore();


    /* =================================================
       ЦЕНТР
    ================================================= */

    if (
        progress >= 1
    ) {

        ctx.fillStyle =
            "#fff";


        ctx.beginPath();


        ctx.arc(
            center,
            center,
            2,
            0,
            Math.PI * 2
        );


        ctx.fill();

    }

}


/* =====================================================
   АНИМАЦИЯ
===================================================== */

function animateCube(data) {


    /*
       Если включён быстрый режим
    */

    if (
        fastModeCheckbox.checked
    ) {

        if (data.animation) {

            cancelAnimationFrame(
                data.animation
            );

            data.animation =
                null;
        }


        /*
           Кадр 1:
           пустой куб
        */

        data.progress =
            0;


        drawCube(
            data,
            0
        );


        /*
           Кадр 2:
           полный куб
        */

        requestAnimationFrame(
            () => {

                data.progress =
                    1;


                drawCube(
                    data,
                    1
                );


                checkAllCubesFilled();

            }
        );


        return;
    }


    /*
       ОБЫЧНЫЙ РЕЖИМ
    */

    if (data.animation) {

        cancelAnimationFrame(
            data.animation
        );
    }


    const start =
        performance.now();


    function frame(now) {

        const elapsed =
            now - start;


        data.progress =
            Math.min(
                elapsed /
                FILL_TIME,
                1
            );


        drawCube(
            data,
            data.progress
        );


        if (
            data.progress < 1
        ) {

            data.animation =
                requestAnimationFrame(
                    frame
                );

        } else {

            data.animation =
                null;


            checkAllCubesFilled();

        }

    }


    data.progress =
        0;


    data.animation =
        requestAnimationFrame(
            frame
        );
}


/* =====================================================
   ВСЕ КУБЫ ЗАПОЛНЕНЫ?
===================================================== */

function checkAllCubesFilled() {

    if (
        cubes.length === 0
    ) {

        percentageButton.style.display =
            "none";

        return;
    }


    const allFilled =
        cubes.every(
            cube =>
                cube.progress >= 1
        );


    if (allFilled) {

        percentageButton.style.display =
            "block";

    } else {

        percentageButton.style.display =
            "none";

    }
}


/* =====================================================
   САМЫЙ ЧАСТЫЙ ЦВЕТ
===================================================== */

function getDominantColor(data) {

    const groups = [];


    data.colors.forEach(
        color => {

            let found =
                null;


            for (
                const group
                of groups
            ) {

                let difference =
                    Math.abs(
                        color.hue -
                        group.hue
                    );


                difference =
                    Math.min(
                        difference,
                        360 -
                        difference
                    );


                if (
                    difference <= 5
                ) {

                    found =
                        group;

                    break;
                }
            }


            if (found) {

                found.count++;

            } else {

                groups.push({

                    hue:
                        color.hue,

                    count:
                        1,

                    css:
                        color.css

                });

            }

        }
    );


    groups.sort(
        (a, b) =>
            b.count -
            a.count
    );


    return groups[0];
}


/* =====================================================
   ПОКАЗАТЬ ПРОЦЕНТЫ
===================================================== */

function showPercentages() {

    const allFilled =
        cubes.every(
            cube =>
                cube.progress >= 1
        );


    if (!allFilled) {

        return;
    }


    cubes.forEach(
        cube => {

            const dominant =
                getDominantColor(
                    cube
                );


            const percentage =
                Math.round(
                    dominant.count /
                    LINE_COUNT *
                    100
                );


            cube.percentage.textContent =
                `${percentage}%`;


            cube.percentage.style.color =
                dominant.css;


            cube.percentage.style.display =
                "block";


            cube.showPercentage =
                true;

        }
    );
}


/* =====================================================
   РАСКЛАДКА
===================================================== */

function updateLayout() {

    const count =
        cubes.length;


    if (
        count === 0
    ) {

        return;
    }


    const gameArea =
        document.getElementById(
            "gameArea"
        );


    const areaWidth =
        gameArea.clientWidth;


    const areaHeight =
        gameArea.clientHeight;


    let bestColumns =
        1;


    let bestRows =
        count;


    let bestSize =
        0;


    for (
        let columns = 1;
        columns <= count;
        columns++
    ) {

        const rows =
            Math.ceil(
                count /
                columns
            );


        const width =
            (
                areaWidth -
                GAP *
                (columns - 1)
            ) /
            columns;


        const height =
            (
                areaHeight -
                GAP *
                (rows - 1)
            ) /
            rows;


        const size =
            Math.floor(
                Math.min(
                    width,
                    height
                )
            );


        if (
            size >
            bestSize
        ) {

            bestSize =
                size;

            bestColumns =
                columns;

            bestRows =
                rows;
        }

    }


    cubesContainer.style.gridTemplateColumns =
        `repeat(${bestColumns}, ${bestSize}px)`;


    cubesContainer.style.gridTemplateRows =
        `repeat(${bestRows}, ${bestSize}px)`;


    cubes.forEach(
        cube =>
            resizeCube(cube)
    );
}


/* =====================================================
   КНОПКИ
===================================================== */

function updateButtons() {

    const count =
        cubes.length;


    if (
        count <
        MAX_CUBES
    ) {

        addButton.textContent =
            `Добавить куб ${count}/21`;


        addButton.disabled =
            false;

    } else {

        addButton.textContent =
            "Добавить куб 21/21";


        addButton.disabled =
            true;
    }


    if (
        count >= 2
    ) {

        removeButton.style.display =
            "block";

    } else {

        removeButton.style.display =
            "none";
    }
}


/* =====================================================
   ДОБАВЛЕНИЕ КУБА
===================================================== */

addButton.addEventListener(
    "click",
    () => {

        if (
            cubes.length >=
            MAX_CUBES
        ) {

            return;
        }


        /*
           Проценты скрываем
        */

        percentageButton.style.display =
            "none";


        const cube =
            createCube();


        updateLayout();

        updateButtons();


        requestAnimationFrame(
            () => {

                resizeCube(
                    cube
                );


                animateCube(
                    cube
                );

            }
        );

    }
);


/* =====================================================
   УДАЛЕНИЕ КУБА
===================================================== */

removeButton.addEventListener(
    "click",
    () => {

        if (
            cubes.length <= 1
        ) {

            return;
        }


        percentageButton.style.display =
            "none";


        const removed =
            cubes.pop();


        if (
            removed.animation
        ) {

            cancelAnimationFrame(
                removed.animation
            );
        }


        removed.element.remove();


        updateLayout();

        updateButtons();

    }
);


/* =====================================================
   ЗАНОВО
===================================================== */

restartButton.addEventListener(
    "click",
    () => {

        /*
           Скрываем проценты
        */

        percentageButton.style.display =
            "none";


        cubes.forEach(
            cube => {

                cube.colors =
                    generateColors();


                cube.percentage.style.display =
                    "none";


                cube.showPercentage =
                    false;

            }
        );


        /*
           Перезапускаем
        */

        cubes.forEach(
            cube =>
                animateCube(
                    cube
                )
        );

    }
);


/* =====================================================
   ПРОЦЕНТЫ
===================================================== */

percentageButton.addEventListener(
    "click",
    () => {

        showPercentages();

    }
);


/* =====================================================
   БЫСТРЫЙ РЕЖИМ
===================================================== */

fastModeCheckbox.addEventListener(
    "change",
    () => {

        /*
           Проценты скрываем
        */

        percentageButton.style.display =
            "none";


        /*
           Перезапускаем
           все кубы в новом режиме
        */

        cubes.forEach(
            cube => {

                if (
                    cube.animation
                ) {

                    cancelAnimationFrame(
                        cube.animation
                    );

                    cube.animation =
                        null;
                }


                cube.percentage.style.display =
                    "none";


                cube.showPercentage =
                    false;


                animateCube(
                    cube
                );

            }
        );

    }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        updateLayout();

    }
);


/* =====================================================
   СТАРТ
===================================================== */

createCube();

updateLayout();

updateButtons();


const firstCube =
    cubes[0];


requestAnimationFrame(
    () => {

        resizeCube(
            firstCube
        );


        animateCube(
            firstCube
        );

    }
);

</script>

</body>
</html>
