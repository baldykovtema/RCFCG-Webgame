<style>

/* =====================================================
   ОСНОВА
===================================================== */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

/* =====================================================
   АВТОРИЗАЦИЯ
===================================================== */

#authScreen {

    position: fixed;

    inset: 0;

    background: #111;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 1000;
}


#authBox {

    width: 360px;

    max-width: 90vw;

    padding: 30px;

    border-radius: 14px;

    border: 1px solid rgba(255,255,255,0.18);

}


#authTitle {

    font-weight: bold;
}


.authInput {

    width: 100%;

    margin-bottom: 12px;

    padding: 0 14px;

    border-radius: 8px;

    border: 1px solid rgba(255,255,255,0.15);

    font-size: 16px;
}


.authInput::placeholder {

}

#loginButton,

}


#loginButton {

    background:

}


#loginButton:hover {

}


#registerButton {

    background:

}


#registerButton:hover {

#loginButton:active,
#registerButton:active {

#authMessage {

#backToLogin {

/* =====================================================
   ИГРА
===================================================== */

#game {

}


#gameArea {

    left: 50%;

}


#cubes {

}


.cube {

    position: relative;

canvas {

button:hover {

}


button:active {

}

}


#addCube {

}

.lbCubeWrap canvas {

.lbPercentage {

#leaderboardMessage {

}


#leaderboardBack {

        rgba(68,68,68,0.35);
}

        rgba(68,68,68,0.48);
}


/* =====================================================
   ВЫХОД
===================================================== */

#logoutButton {

    position: fixed;

    top: 15px;

    right: 15px;

    z-index: 200;

    padding: 9px 14px;

        rgba(181,43,43,0.35);
}


#logoutButton:hover {

    background:
        rgba(181,43,43,0.55);
}

<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://htooxiwcryzjopbnitef.supabase.co";


/*
   ВСТАВЬ СЮДА СВОЙ PUBLISHABLE KEY / ANON KEY
   ИМЕННО ОТ ЭТОГО ПРОЕКТА.
*/

const SUPABASE_ANON_KEY =
    "sb_publishable_EvgpU14PTHkWQRUfr6f9RQ_lOVMrN9B";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   ЭЛЕМЕНТЫ АВТОРИЗАЦИИ
===================================================== */

const authScreen =
    document.getElementById(
        "authScreen"
    );


const game =
    document.getElementById(
        "game"
    );


const usernameInput =
    document.getElementById(
        "usernameInput"
    );


const passwordInput =
    document.getElementById(
        "passwordInput"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const registerButton =
    document.getElementById(
        "registerButton"
    );


const backToLogin =
    document.getElementById(
        "backToLogin"
    );


const registerText =
    document.getElementById(
        "registerText"
    );


const authMessage =
    document.getElementById(
        "authMessage"
    );


const logoutButton =
    document.getElementById(
        "logoutButton"
    );


let registrationMode = false;


/* =====================================================
   СООБЩЕНИЯ
===================================================== */

function showAuthMessage(message) {

    authMessage.textContent =
        message;

}


/* =====================================================
   ПРОВЕРКА ЛОГИНА
===================================================== */

function isValidUsername(username) {

    return /^[a-zA-Z0-9_]{3,30}$/
        .test(username);

}


/* =====================================================
   ТЕХНИЧЕСКИЙ EMAIL
===================================================== */

function usernameToEmail(username) {

    return (
        username
            .trim()
            .toLowerCase()
        +
        "@rcfcg-game.com"
    );

}


/* =====================================================
   ПОКАЗАТЬ ИГРУ
===================================================== */

function showGame() {

    authScreen.style.display =
        "none";

    game.style.display =
        "block";

    requestAnimationFrame(
        () => {

            updateLayout();

        }
    );

}


/* =====================================================
   ПОКАЗАТЬ АВТОРИЗАЦИЮ
===================================================== */

function showAuth() {

    game.style.display =
        "none";

    authScreen.style.display =
        "flex";

}


/* =====================================================
   РЕЖИМ РЕГИСТРАЦИИ
===================================================== */

function enterRegistrationMode() {

    registrationMode =
        true;


    document.getElementById(
        "authTitle"
    ).textContent =
        "Регистрация";


    loginButton.style.display =
        "none";


    registerText.style.display =
        "none";


    registerButton.textContent =
        "Создать аккаунт";


    backToLogin.style.display =
        "block";


    passwordInput.value =
        "";


    showAuthMessage("");

}


/* =====================================================
   НАЗАД КО ВХОДУ
===================================================== */

backToLogin.addEventListener(
    "click",
    () => {

        registrationMode =
            false;


        document.getElementById(
            "authTitle"
        ).textContent =
            "RCFCG";


        loginButton.style.display =
            "block";


        registerText.style.display =
            "block";


        registerButton.textContent =
            "Зарегистрироваться";


        backToLogin.style.display =
            "none";


        showAuthMessage("");

    }
);


/* =====================================================
   НАЖАТИЕ РЕГИСТРАЦИИ
===================================================== */

registerButton.addEventListener(
    "click",
    async () => {

        if (!registrationMode) {

            enterRegistrationMode();

            return;

        }


        const username =
            usernameInput.value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        if (
            !isValidUsername(
                username
            )
        ) {

            showAuthMessage(
                "Логин: 3–30 символов. Используй только латинские буквы, цифры и _."
            );

            return;

        }


        if (
            password.length < 6
        ) {

            showAuthMessage(
                "Пароль должен содержать минимум 6 символов."
            );

            return;

        }


        registerButton.disabled =
            true;


        showAuthMessage(
            "Создание аккаунта..."
        );


        const email =
            usernameToEmail(
                username
            );


        const {
            data,
            error
        } =
            await supabaseClient.auth.signUp({

                email:
                    email,

                password:
                    password,

                options: {

                    data: {

                        username:
                            username

                    }

                }

            });


        registerButton.disabled =
            false;


        if (error) {

            console.error(error);


            if (
                error.message
                    .toLowerCase()
                    .includes(
                        "already registered"
                    )
            ) {

                showAuthMessage(
                    "Такой логин уже занят."
                );

            } else {

                showAuthMessage(
                    "Ошибка: " +
                    error.message
                );

            }


            return;

        }


        /*
           Если Confirm email выключен,
           session будет создана сразу.
        */

        if (
            data.session
        ) {

            showAuthMessage("");

            showGame();

            return;

        }


        /*
           Если подтверждение почему-то включено.
        */

        showAuthMessage(
            "Аккаунт создан. Проверь настройки Confirm email в Supabase."
        );


        registrationMode =
            false;


        document.getElementById(
            "authTitle"
        ).textContent =
            "RCFCG";


        loginButton.style.display =
            "block";


        registerText.style.display =
            "block";


        registerButton.textContent =
            "Зарегистрироваться";


        backToLogin.style.display =
            "none";

    }
);


/* =====================================================
   ВХОД
===================================================== */

loginButton.addEventListener(
    "click",
    async () => {

        const username =
            usernameInput.value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        if (!username) {

            showAuthMessage(
                "Введите логин."
            );

            return;

        }


        if (!password) {

            showAuthMessage(
                "Введите пароль."
            );

            return;

        }


        if (
            !isValidUsername(
                username
            )
        ) {

            showAuthMessage(
                "Неверный логин."
            );

            return;

        }


        loginButton.disabled =
            true;


        showAuthMessage(
            "Выполняется вход..."
        );


        const email =
            usernameToEmail(
                username
            );


        const {
            data,
            error
        } =
            await supabaseClient.auth
                .signInWithPassword({

                    email:
                        email,

                    password:
                        password

                });


        loginButton.disabled =
            false;


        if (error) {

            console.error(error);


            showAuthMessage(
                "Неверный логин или пароль."
            );

            return;

        }


        showAuthMessage("");

        showGame();

    }
);


/* =====================================================
   ENTER
===================================================== */

usernameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            passwordInput.focus();

        }

    }
);


passwordInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            if (
                registrationMode
            ) {

                registerButton.click();

            } else {

                loginButton.click();

            }

        }

    }
);


/* =====================================================
   ВЫХОД
===================================================== */

logoutButton.addEventListener(
    "click",
    async () => {

        await supabaseClient.auth.signOut();


        showAuth();


        usernameInput.value =
            "";


        passwordInput.value =
            "";


        registrationMode =
            false;


        document.getElementById(
            "authTitle"
        ).textContent =
            "RCFCG";


        loginButton.style.display =
            "block";


        registerText.style.display =
            "block";


        registerButton.textContent =
            "Зарегистрироваться";


        backToLogin.style.display =
            "none";


        showAuthMessage("");

    }
);


/* =====================================================
   ПРОВЕРКА СЕССИИ
===================================================== */

async function checkSession() {

    const {
        data
    } =
        await supabaseClient.auth
            .getSession();


    if (
        data.session
    ) {

        showGame();

    } else {

        showAuth();

    }

}


checkSession();


/* =====================================================
   КУБЫ
===================================================== */

const MAX_CUBES =
    21;


const LINE_COUNT =
    80;


const FILL_TIME =
    3000;


const GAP =
    10;


const cubesContainer =
    document.getElementById(
        "cubes"
    );


const addButton =
    document.getElementById(
        "addCube"
    );


const removeButton =
    document.getElementById(
        "removeCube"
    );


const restartButton =
    document.getElementById(
        "restart"
    );


const percentageButton =
    document.getElementById(
        "percentageButton"
    );


const fastModeCheckbox =
    document.getElementById(
        "fastModeCheckbox"
    );


let cubes = [];


/* =====================================================
   СЛУЧАЙНЫЙ ЦВЕТ
===================================================== */

function randomColor() {

    const hue =
        Math.floor(
            Math.random() * 360
        );


    const saturation =
        75 +
        Math.random() * 25;


    const lightness =
        50 +
        Math.random() * 20;


    return {

        css:
            `hsl(${hue}, ${saturation}%, ${lightness}%)`,

        hue:
            hue

    };

}


/* =====================================================
   ЦВЕТА
===================================================== */

function generateColors() {

    const colors = [];


    for (
        let i = 0;
        i < LINE_COUNT;
        i++
    ) {

        colors.push(
            randomColor()
        );

    }


    return colors;

}


/* =====================================================
   СОЗДАНИЕ КУБА
===================================================== */

function createCube() {

    const cube =
        document.createElement(
            "div"
        );


    cube.className =
        "cube";


    const canvas =
        document.createElement(
            "canvas"
        );


    cube.appendChild(
        canvas
    );


    const percentage =
        document.createElement(
            "div"
        );


    percentage.className =
        "percentage";


    percentage.textContent =
        "0%";


    cube.appendChild(
        percentage
    );


    cubesContainer.appendChild(
        cube
    );


    const data = {

        element:
            cube,

        canvas:
            canvas,

        percentage:
            percentage,

        colors:
            generateColors(),

        progress:
            0,

        animation:
            null,

        showPercentage:
            false

    };


    cubes.push(
        data
    );


    resizeCube(
        data
    );


    return data;

}


/* =====================================================
   РАЗМЕР КУБА
===================================================== */

function resizeCube(data) {

    const rect =
        data.element
            .getBoundingClientRect();


    if (
        rect.width <= 0 ||
        rect.height <= 0
    ) {

        return;

    }


    const size =
        Math.floor(
            Math.min(
                rect.width,
                rect.height
            )
        );


    data.canvas.width =
        size;


    data.canvas.height =
        size;


    drawCube(
        data,
        data.progress
    );

}


/* =====================================================
   РИСОВАНИЕ
===================================================== */

function drawCube(
    data,
    progress
) {

    const canvas =
        data.canvas;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const size =
        canvas.width;


    if (
        size <= 0
    ) {

        return;

    }


    ctx.clearRect(
        0,
        0,
        size,
        size
    );


    const center =
        size / 2;


    /* =================================================
       ЛЕВО
    ================================================= */

    ctx.save();


    ctx.beginPath();


    ctx.moveTo(
        0,
        0
    );


    ctx.lineTo(
        center,
        center
    );


    ctx.lineTo(
        0,
        size
    );


    ctx.closePath();


    ctx.clip();


    const lineHeight =
        size / LINE_COUNT;


    for (
        let i = 0;
        i < LINE_COUNT;
        i++
    ) {

        const y =
            i * lineHeight;


        const maxX =
            center *
            (
                1 -
                Math.abs(
                    y +
                    lineHeight / 2 -
                    center
                ) /
                center
            );


        const currentX =
            maxX *
            progress;


        ctx.fillStyle =
            data.colors[i].css;


        ctx.fillRect(
            0,
            y,
            currentX,
            lineHeight + 1
        );

    }


    ctx.restore();


    /* =================================================
       ПРАВО
    ================================================= */

    ctx.save();


    ctx.beginPath();


    ctx.moveTo(
        size,
        0
    );


    ctx.lineTo(
        center,
        center
    );


    ctx.lineTo(
        size,
        size
    );


    ctx.closePath();


    ctx.clip();


    for (
        let i = 0;
        i < LINE_COUNT;
        i++
    ) {

        const y =
            i * lineHeight;


        const maxX =
            center *
            (
                1 -
                Math.abs(
                    y +
                    lineHeight / 2 -
                    center
                ) /
                center
            );


        const currentX =
            maxX *
            progress;


        ctx.fillStyle =
            data.colors[
                (i + 20) %
                LINE_COUNT
            ].css;


        ctx.fillRect(
            size - currentX,
            y,
            currentX,
            lineHeight + 1
        );

    }


    ctx.restore();


    /* =================================================
       ВЕРХ
    ================================================= */

    ctx.save();


    ctx.beginPath();


    ctx.moveTo(
        0,
        0
    );


    ctx.lineTo(
        size,
        0
    );


    ctx.lineTo(
        center,
        center
    );


    ctx.closePath();


    ctx.clip();


    const lineWidth =
        size / LINE_COUNT;


    for (
        let i = 0;
        i < LINE_COUNT;
        i++
    ) {

        const x =
            i * lineWidth;


        const maxY =
            center *
            (
                1 -
                Math.abs(
                    x +
                    lineWidth / 2 -
                    center
                ) /
                center
            );


        const currentY =
            maxY *
            progress;


        ctx.fillStyle =
            data.colors[
                (i + 40) %
                LINE_COUNT
            ].css;


        ctx.fillRect(
            x,
            0,
            lineWidth + 1,
            currentY
        );

    }


    ctx.restore();


    /* =================================================
       НИЗ
    ================================================= */

    ctx.save();


    ctx.beginPath();


    ctx.moveTo(
        0,
        size
    );


    ctx.lineTo(
        center,
        center
    );


    ctx.lineTo(
        size,
        size
    );


    ctx.closePath();


    ctx.clip();


    for (
        let i = 0;
        i < LINE_COUNT;
        i++
    ) {

        const x =
            i * lineWidth;


        const maxY =
            center *
            (
                1 -
                Math.abs(
                    x +
                    lineWidth / 2 -
                    center
                ) /
                center
            );


        const currentY =
            maxY *
            progress;


        ctx.fillStyle =
            data.colors[
                (i + 60) %
                LINE_COUNT
            ].css;


        ctx.fillRect(
            x,
            size - currentY,
            lineWidth + 1,
            currentY
        );

    }


    ctx.restore();


    /* =================================================
       ЦЕНТР
    ================================================= */

    if (
        progress >= 1
    ) {

        ctx.fillStyle =
            "#fff";


        ctx.beginPath();


        ctx.arc(
            center,
            center,
            2,
            0,
            Math.PI * 2
        );


        ctx.fill();

    }

}


/* =====================================================
   АНИМАЦИЯ
===================================================== */

function animateCube(data) {

    if (
        fastModeCheckbox.checked
    ) {

        if (
            data.animation
        ) {

            cancelAnimationFrame(
                data.animation
            );


            data.animation =
                null;

        }


        data.progress =
            0;


        drawCube(
            data,
            0
        );


        requestAnimationFrame(
            () => {

                data.progress =
                    1;


                drawCube(
                    data,
                    1
                );


                checkAllCubesFilled();

            }
        );


        return;

    }


    if (
        data.animation
    ) {

        cancelAnimationFrame(
            data.animation
        );

    }


    const start =
        performance.now();


    function frame(now) {

        const elapsed =
            now - start;


        data.progress =
            Math.min(
                elapsed /
                FILL_TIME,
                1
            );


        drawCube(
            data,
            data.progress
        );


        if (
            data.progress < 1
        ) {

            data.animation =
                requestAnimationFrame(
                    frame
                );

        } else {

            data.animation =
                null;


            checkAllCubesFilled();

        }

    }


    data.progress =
        0;


    data.animation =
        requestAnimationFrame(
            frame
        );

}


/* =====================================================
   ВСЕ КУБЫ ЗАПОЛНЕНЫ?
===================================================== */

function checkAllCubesFilled() {

    if (
        cubes.length === 0
    ) {

        percentageButton.style.display =
            "none";


        return;

    }


    const allFilled =
        cubes.every(
            cube =>
                cube.progress >= 1
        );


    if (
        allFilled
    ) {

        percentageButton.style.display =
            "block";

    } else {

        percentageButton.style.display =
            "none";

    }

}


/* =====================================================
   САМЫЙ ЧАСТЫЙ ЦВЕТ
===================================================== */

function getDominantColor(data) {

    const groups = [];


    data.colors.forEach(
        color => {

            let found =
                null;


            for (
                const group
                of groups
            ) {

                let difference =
                    Math.abs(
                        color.hue -
                        group.hue
                    );


                difference =
                    Math.min(
                        difference,
                        360 -
                        difference
                    );


                if (
                    difference <= 5
                ) {

                    found =
                        group;

                    break;

                }

            }


            if (
                found
            ) {

                found.count++;

            } else {

                groups.push({

                    hue:
                        color.hue,

                    count:
                        1,

                    css:
                        color.css

                });

            }

        }
    );


    groups.sort(
        (a,b) =>
            b.count -
            a.count
    );


    return groups[0];

}


/* =====================================================
   ПРОЦЕНТЫ
===================================================== */

function showPercentages() {

    const allFilled =
        cubes.every(
            cube =>
                cube.progress >= 1
        );


    if (
        !allFilled
    ) {

        return;

    }


    let best = null;


    cubes.forEach(
        cube => {

            const dominant =
                getDominantColor(
                    cube
                );


            const percentage =
                Math.round(
                    dominant.count /
                    LINE_COUNT *
                    100
                );


            cube.percentage.textContent =
                `${percentage}%`;


            cube.percentage.style.color =
                dominant.css;


            cube.percentage.style.display =
                "block";


            cube.showPercentage =
                true;


            if (
                !best ||
                percentage >
                    best.percentage
            ) {

                best = {

                    percentage:
                        percentage,

                    dominantCss:
                        dominant.css,

                    colors:
                        cube.colors

                };

            }

        }
    );


    if (
        best
    ) {

        saveToLeaderboard(
            best.percentage,
            best.dominantCss,
            best.colors
        );

    }

}


/* =====================================================
   РАСКЛАДКА
===================================================== */

function updateLayout() {

    const count =
        cubes.length;


    if (
        count === 0
    ) {

        return;

    }


    const gameArea =
        document.getElementById(
            "gameArea"
        );


    const areaWidth =
        gameArea.clientWidth;


    const areaHeight =
        gameArea.clientHeight;


    let bestColumns =
        1;


    let bestRows =
        count;


    let bestSize =
        0;


    for (
        let columns = 1;
        columns <= count;
        columns++
    ) {

        const rows =
            Math.ceil(
                count /
                columns
            );


        const width =
            (
                areaWidth -
                GAP *
                (columns - 1)
            ) /
            columns;


        const height =
            (
                areaHeight -
                GAP *
                (rows - 1)
            ) /
            rows;


        const size =
            Math.floor(
                Math.min(
                    width,
                    height
                )
            );


        if (
            size >
            bestSize
        ) {

            bestSize =
                size;

            bestColumns =
                columns;

            bestRows =
                rows;

        }

    }


    cubesContainer.style.gridTemplateColumns =
        `repeat(${bestColumns}, ${bestSize}px)`;


    cubesContainer.style.gridTemplateRows =
        `repeat(${bestRows}, ${bestSize}px)`;


    cubes.forEach(
        cube =>
            resizeCube(
                cube
            )
    );

}


/* =====================================================
   КНОПКИ
===================================================== */

function updateButtons() {

    const count =
        cubes.length;


    if (
        count < MAX_CUBES
    ) {

        addButton.textContent =
            `Добавить куб ${count}/21`;


        addButton.disabled =
            false;

    } else {

        addButton.textContent =
            "Добавить куб 21/21";


        addButton.disabled =
            true;

    }


    if (
        count >= 2
    ) {

        removeButton.style.display =
            "block";

    } else {

        removeButton.style.display =
            "none";

    }

}


/* =====================================================
   ДОБАВИТЬ КУБ
===================================================== */

addButton.addEventListener(
    "click",
    () => {

        if (
            cubes.length >=
            MAX_CUBES
        ) {

            return;

        }


        percentageButton.style.display =
            "none";


        const cube =
            createCube();


        updateLayout();

        updateButtons();


        requestAnimationFrame(
            () => {

                resizeCube(
                    cube
                );


                animateCube(
                    cube
                );

            }
        );

    }
);


/* =====================================================
   УБРАТЬ КУБ
===================================================== */

removeButton.addEventListener(
    "click",
    () => {

        if (
            cubes.length <= 1
        ) {

            return;

        }


        percentageButton.style.display =
            "none";


        const removed =
            cubes.pop();


        if (
            removed.animation
        ) {

            cancelAnimationFrame(
                removed.animation
            );

        }


        removed.element.remove();


        updateLayout();

        updateButtons();

    }
);


/* =====================================================
   ЗАНОВО
===================================================== */

restartButton.addEventListener(
    "click",
    () => {

        percentageButton.style.display =
            "none";


        cubes.forEach(
            cube => {

                cube.colors =
                    generateColors();


                cube.percentage.style.display =
                    "none";


                cube.showPercentage =
                    false;

            }
        );


        cubes.forEach(
            cube =>
                animateCube(
                    cube
                )
        );

    }
);


/* =====================================================
   ПРОЦЕНТЫ
===================================================== */

percentageButton.addEventListener(
    "click",
    () => {

        showPercentages();

    }
);


/* =====================================================
   БЫСТРЫЙ РЕЖИМ
===================================================== */

fastModeCheckbox.addEventListener(
    "change",
    () => {

        percentageButton.style.display =
            "none";


        cubes.forEach(
            cube => {

                if (
                    cube.animation
                ) {

                    cancelAnimationFrame(
                        cube.animation
                    );


                    cube.animation =
                        null;

                }


                cube.percentage.style.display =
                    "none";


                cube.showPercentage =
                    false;


                animateCube(
                    cube
                );

            }
        );

    }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        updateLayout();

    }
);


/* =====================================================
   ТАБЛИЦА ЛИДЕРОВ
===================================================== */

const leaderboardButton =
    document.getElementById(
        "leaderboardButton"
    );


const leaderboardScreen =
    document.getElementById(
        "leaderboardScreen"
    );


const leaderboardBack =
    document.getElementById(
        "leaderboardBack"
    );


const leaderboardMessage =
    document.getElementById(
        "leaderboardMessage"
    );


const leaderboardSlots = [

    document.getElementById(
        "slot0"
    ),

    document.getElementById(
        "slot1"
    ),

    document.getElementById(
        "slot2"
    )

];


/* =====================================================
   СОХРАНЕНИЕ РЕЗУЛЬТАТА
===================================================== */

async function saveToLeaderboard(
    percentage,
    dominantCss,
    colors
) {

    try {

        const {
            data: userData
        } =
            await supabaseClient.auth
                .getUser();


        const user =
            userData.user;


        if (
            !user
        ) {

            return;

        }


        const username =
            (
                user.user_metadata &&
                user.user_metadata
                    .username
            )
                ?
                    user.user_metadata
                        .username
                :
                    user.email
                        .split("@")[0];


        const {
            data: existing
        } =
            await supabaseClient
                .from("leaderboard")
                .select(
                    "best_percentage"
                )
                .eq(
                    "user_id",
                    user.id
                )
                .maybeSingle();


        if (
            existing &&
            existing.best_percentage >=
                percentage
        ) {

            return;

        }


        const {
            error
        } =
            await supabaseClient
                .from("leaderboard")
                .upsert({

                    user_id:
                        user.id,

                    username:
                        username,

                    best_percentage:
                        percentage,

                    dominant_color:
                        dominantCss,

                    colors:
                        colors.map(
                            color =>
                                color.css
                        )

                });


        if (
            error
        ) {

            console.error(
                "Leaderboard save:",
                error
            );

        }

    } catch (e) {

        console.error(
            "Leaderboard save:",
            e
        );

    }

}


/* =====================================================
   ОТРИСОВКА МЕСТА
===================================================== */

function renderLeaderboardSlot(
    slot,
    row
) {

    const canvas =
        slot.querySelector(
            "canvas"
        );


    const percentageEl =
        slot.querySelector(
            ".lbPercentage"
        );


    const nameEl =
        slot.querySelector(
            ".lbName"
        );


    const wrap =
        slot.querySelector(
            ".lbCubeWrap"
        );


    const size =
        Math.floor(
            wrap
                .getBoundingClientRect()
                .width
        );


    canvas.width =
        size > 0 ? size : 200;


    canvas.height =
        canvas.width;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (
        !row
    ) {

        percentageEl.textContent =
            "";


        nameEl.textContent =
            "—";


        return;

    }


    const colors =
        (row.colors || []).map(
            css => ({
                css: css
            })
        );


    if (
        colors.length ===
            LINE_COUNT
    ) {

        drawCube(
            {
                canvas:
                    canvas,

                colors:
                    colors
            },
            1
        );

    }


    percentageEl.textContent =
        row.best_percentage + "%";


    percentageEl.style.color =
        row.dominant_color ||
        "white";


    nameEl.textContent =
        row.username;

}


/* =====================================================
   ОТКРЫТЬ ТАБЛИЦУ
===================================================== */

leaderboardButton.addEventListener(
    "click",
    async () => {

        game.style.display =
            "none";


        leaderboardScreen.style.display =
            "flex";


        leaderboardMessage.textContent =
            "Загрузка...";


        const {
            data,
            error
        } =
            await supabaseClient
                .from("leaderboard")
                .select(
                    "username, best_percentage, dominant_color, colors"
                )
                .order(
                    "best_percentage",
                    {
                        ascending:
                            false
                    }
                )
                .limit(3);


        if (
            error
        ) {

            console.error(
                "Leaderboard load:",
                error
            );


            leaderboardMessage.textContent =
                "Не удалось загрузить таблицу лидеров.";


            return;

        }


        leaderboardMessage.textContent =
            data.length
                ? ""
                : "Пока нет результатов.";


        requestAnimationFrame(
            () => {

                leaderboardSlots
                    .forEach(
                        (
                            slot,
                            index
                        ) => {

                            renderLeaderboardSlot(
                                slot,
                                data[
                                    index
                                ] ||
                                null
                            );

                        }
                    );

            }
        );

    }
);


/* =====================================================
   НАЗАД К ИГРЕ
===================================================== */

leaderboardBack.addEventListener(
    "click",
    () => {

        leaderboardScreen.style.display =
            "none";


        game.style.display =
            "block";


        requestAnimationFrame(
            () => {

                updateLayout();

            }
        );

    }
);


/* =====================================================
   СТАРТ
===================================================== */

createCube();

updateLayout();

updateButtons();


const firstCube =
    cubes[0];


requestAnimationFrame(
    () => {

        resizeCube(
            firstCube
        );


        animateCube(
            firstCube
        );

    }
);

</script>
